<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SYSTEM</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="notice" class="notice" style="display:none;"></div>

  <div class="window">
    <h1>SYSTEM</h1>
    <p>Player Rank: <b id="rank">E-Rank</b></p>
    <p>Level: <b id="level">1</b></p>
    <p>XP: <b id="xp">0</b> / <b id="need">100</b></p>
    <div class="bar"><div id="fill"></div></div>
    <p>Streak: <b id="streak">0</b> day(s)</p>
  </div>

  <div class="window">
    <h2>STATUS</h2>
    <div class="stats">
      <div>STR <b id="STR">0</b></div>
      <div>AGI <b id="AGI">0</b></div>
      <div>INT <b id="INT">0</b></div>
      <div>VIT <b id="VIT">0</b></div>
    </div>
  </div>

  <div class="window">
    <h2>DAILY QUESTS</h2>
    <input id="newQuest" placeholder="e.g. 50 push-ups">
    <select id="questStat">
      <option value="STR">Strength (STR)</option>
      <option value="AGI">Agility (AGI)</option>
      <option value="INT">Intelligence (INT)</option>
      <option value="VIT">Vitality (VIT)</option>
    </select>
    <button onclick="addQuest()">Add Quest</button>
    <div id="list"></div>
  </div>

  <div class="window">
    <button class="danger" onclick="resetAll()">Reset Everything</button>
  </div>

<script src="script.js"></script>
</body>
</html>
